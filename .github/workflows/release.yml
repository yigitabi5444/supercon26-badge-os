# Tag push v* (e.g. v0.2): build with that version and attach the images to the GitHub release.
# badge_os.bin is what Online update downloads; badge_os_full.bin (bootloader + table + app) flashes at 0x0 by cable.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag, the badge Wi-Fi (public at Supercon, so plain here)
        run: |
          echo "${GITHUB_REF_NAME#v}" > version.txt
          printf '#define WIFI_SSID "Supercon"\n#define WIFI_PASS "tink1930"\n' > main/wifi_secret.h
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          command: idf.py build merge-bin -o badge_os_full.bin
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/badge_os.bin
            build/badge_os_full.bin
